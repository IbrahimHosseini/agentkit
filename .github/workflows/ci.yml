name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      # validate.sh runs shellcheck --severity=warning when shellcheck is installed (ubuntu here).
      - name: Validate
        run: scripts/validate.sh
      - name: Tests
        run: |
          if [ -f tests/run.sh ]; then bash tests/run.sh; else echo "no tests/run.sh"; fi

  linux-distros:
    name: Linux (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Fedora
            image: fedora:43
            install: dnf install -y bash git python3 tar coreutils findutils diffutils grep sed gawk procps-ng
          - distro: Arch
            image: archlinux:base
            install: pacman -Syu --noconfirm bash git python tar coreutils findutils diffutils grep sed gawk procps-ng
          - distro: openSUSE Tumbleweed
            image: opensuse/tumbleweed:latest
            install: zypper --non-interactive install bash git python3 tar coreutils findutils diffutils grep sed gawk procps
          - distro: Alpine
            image: alpine:3.22
            install: apk add --no-cache bash git python3 tar coreutils findutils diffutils grep sed gawk procps
    steps:
      # Checkout runs on the Ubuntu host, so Alpine does not need to run Node actions.
      - uses: actions/checkout@v4
      - name: Validate and test in distribution userspace
        env:
          DISTRO_IMAGE: ${{ matrix.image }}
          DISTRO_INSTALL: ${{ matrix.install }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env DISTRO_INSTALL \
            "$DISTRO_IMAGE" sh -eu -c '
              sh -eu -c "$DISTRO_INSTALL"
              scratch_home=$(mktemp -d)
              export HOME="$scratch_home" CODEX_HOME="$scratch_home/.codex"
              bash scripts/validate.sh
              bash tests/run.sh
              python3 -I -m unittest discover -s tests -p "test_*.py"
            '

  native:
    name: Native (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Diagnose Windows launcher exit and self-delete behavior
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $diagnostic = @'
          import os, pathlib, subprocess, sys, tempfile
          root = pathlib.Path.cwd()
          def run(label, argv):
              p = subprocess.run(argv, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, encoding='utf-8', errors='replace')
              print(label, 'RETURN', p.returncode, 'OUTPUT', repr(p.stdout), flush=True)
          run('direct core invalid', [sys.executable, '-I', str(root/'lib/agentkit.py'), 'help', '--definitely-invalid'])
          run('repo launcher invalid', [str(root/'bin/agentkit.cmd'), 'help', '--definitely-invalid'])
          sys.path.insert(0, str(root/'lib'))
          from agentkit_core.platforms import launcher_bytes
          with tempfile.TemporaryDirectory(prefix='agentkit-cmd-diagnostic-') as scratch:
              folder = pathlib.Path(scratch)
              generated = folder/'generated.cmd'
              generated.write_bytes(launcher_bytes(root/'lib/agentkit.py'))
              run('generated launcher invalid', [str(generated), 'help', '--definitely-invalid'])
              payload = folder/'payload.py'
              payload.write_text('import pathlib,sys; p=pathlib.Path(sys.argv[2]); p.unlink() if sys.argv[3]=="delete" else None; sys.exit(int(sys.argv[1]))', encoding='utf-8')
              call = '"' + sys.executable + '" -I "' + str(payload) + '" %1 "%~f0" %2\n'
              variants = {
                  'plain': call + 'exit /b %errorlevel%\n',
                  'one-line': call.rstrip('\n') + ' && exit /b 0 || exit /b 1\n',
                  'leave-context': '(goto) 2>nul & ' + call,
                  'leave-context-normalized': '(goto) 2>nul & ' + call.rstrip('\n') + ' && exit /b 0 || exit /b 1\n',
                  'zero-call': '(\n' + call + 'if errorlevel 1 exit /b 1\nif not errorlevel 0 exit /b 1\nexit /b 0\n)\n',
                  'rem-zero-call': '(\n' + call + 'rem cached termination\nif errorlevel 1 exit /b 1\nif not errorlevel 0 exit /b 1\nexit /b 0\n)\n',
                  'call-set': '(\n' + call + 'call set "AK_EXIT=%%errorlevel%%"\nsetlocal EnableDelayedExpansion\nexit /b !AK_EXIT!\n)\n',
              }
              for name, body in variants.items():
                  for code in ('0', '2'):
                      for deletion in ('keep', 'delete'):
                          batch = folder/(name+'.cmd')
                          batch.write_text('@echo off\nsetlocal DisableDelayedExpansion\nset "ERRORLEVEL="\n'+body, encoding='ascii')
                          run(name+' '+code+' '+deletion, [str(batch), code, deletion])
          '@
          $path = Join-Path $env:RUNNER_TEMP 'agentkit-cmd-diagnostic.py'
          [IO.File]::WriteAllText($path, $diagnostic)
          python -I $path
      - name: Native lifecycle tests
        run: python -I -m unittest discover -s tests -p "test_*.py"
      - name: Native Windows bootstrap and launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          & .\tests\test_bootstrap.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
